<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Work cover concepts</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      body {
        background: var(--canvas-sunk);
      }

      .board {
        padding-block: 40px 64px;
      }

      .board__head {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
      }

      .board__head h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1;
      }

      .board__head p {
        margin-top: 10px;
        max-width: 60ch;
        color: var(--ink-soft);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chips button {
        padding: 8px 14px;
        border: 1px solid var(--divider);
        border-radius: 999px;
        background: var(--canvas);
        color: var(--ink);
        font: 500 0.8125rem "Geist", sans-serif;
        cursor: pointer;
      }

      .chips button[aria-pressed="true"] {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--inverse-text);
      }

      .cols {
        display: grid;
        gap: 28px;
        margin-top: 32px;
      }


      .col {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 18px;
        border-radius: 18px;
        background: var(--canvas);
        box-shadow: 0 0 0 1px var(--divider);
      }

      .col header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      .col h2 {
        font-size: 1.5rem;
        line-height: 1.1;
      }

      .col h2 span {
        color: var(--accent);
      }

      .col header a {
        font-family: "Geist Mono", monospace;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        text-decoration: underline;
        text-underline-offset: 3px;
        white-space: nowrap;
      }

      .col > p {
        max-width: 80ch;
        color: var(--ink-soft);
        font-size: 0.9375rem;
      }

      .board {
        max-width: 90rem;
      }

      .previews {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 0.3fr);
        gap: 16px;
        align-items: start;
      }

      .frame {
        position: relative;
        overflow: hidden;
        border-radius: 10px;
        background: var(--canvas);
        box-shadow: 0 0 0 1px var(--divider);
      }

      .frame iframe {
        position: absolute;
        top: 0;
        left: 0;
        border: 0;
        transform-origin: 0 0;
        background: var(--canvas);
      }

      .frame + .label {
        margin-top: 6px;
      }

      .notes {
        display: grid;
        gap: 10px 32px;
        font-size: 0.875rem;
      }

      @media (min-width: 760px) {
        .notes {
          grid-template-columns: 1fr 1fr;
        }
      }

      .notes h3 {
        font-family: "Geist Mono", monospace;
        font-size: 0.6875rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .notes .plus h3 {
        color: #2f6b3f;
      }

      .notes .minus h3 {
        color: var(--accent);
      }

      .notes ul {
        margin-top: 4px;
        padding-left: 18px;
        list-style: disc;
        color: var(--ink-soft);
      }

      .notes li + li {
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <main class="shell board">
      <div class="board__head">
        <div>
          <p class="label">Work detail / cover band</p>
          <h1 class="font-display">Three ways to stop cropping the cover</h1>
          <p>
            Each row shows the real case-study top at 1440 x 900 and 390 x 844. Pick a
            project to see how its cover behaves; open a concept to scroll it at full size.
          </p>
        </div>
        <div class="chips" id="chips"></div>
      </div>

      <div class="cols" id="cols"></div>
    </main>

    <script src="data.js"></script>
    <script>
      const NOTES = {
        A: {
          pitch:
            "Title and facts first, then the cover laid whole on a sunk paper band with crop marks and a figure caption - a plate in the annotated proof.",
          plus: [
            "Closest to the site's 'annotated proof' language",
            "Never crops, any ratio, any width",
            "H1 is the first thing read, good for scanning",
          ],
          minus: [
            "Least dramatic arrival; the cover starts below the fold on a laptop",
            "Plate is narrower than the screen on very wide displays",
          ],
        },
        B: {
          pitch:
            "Title left, cover right, on a band coloured from the cover's own backdrop. The cover hangs over the band's edge onto the paper.",
          plus: [
            "Title and full cover both visible on arrival",
            "Each case study gets its own key colour",
            "Cover shown at a smaller size, so it stays sharp",
          ],
          minus: [
            "Adds a per-project colour the site does not have today",
            "Cover is smaller; dense screenshots read less well",
            "Needs a tone + text colour field per project",
          ],
        },
        C: {
          pitch:
            "Same order as today - big band, then title - but the band is a stage lit by a blurred copy of the cover, and the cover stands on it whole.",
          plus: [
            "Smallest change to the current page structure",
            "Keeps the immersive full-width arrival",
            "Band height follows the cover, so nothing is cut",
          ],
          minus: [
            "Blurred backdrop is a new effect for this site",
            "Title starts below the fold on a laptop",
            "Light covers give a pale stage; dark covers a heavy one",
          ],
        },
      };

      const chips = document.getElementById("chips");
      const cols = document.getElementById("cols");
      let current = project.slug;

      function renderChips() {
        chips.innerHTML = PROJECTS.map(
          (p) =>
            `<button type="button" data-slug="${p.slug}" aria-pressed="${p.slug === current}">${p.index} ${esc(p.title)}</button>`,
        ).join("");
      }

      function renderCols() {
        cols.innerHTML = CONCEPTS.map((c) => {
          const n = NOTES[c.key];
          const src = `${c.file}?p=${current}&embed`;
          return `
            <article class="col">
              <header>
                <h2 class="font-display"><span>${c.key}</span> ${c.name}</h2>
                <a href="${c.file}?p=${current}" target="_blank">Open full</a>
              </header>
              <p>${n.pitch}</p>
              <div class="previews">
                <div>
                  <div class="frame" data-w="1440" data-h="900"><iframe src="${src}" title="${c.name} desktop" loading="lazy"></iframe></div>
                  <p class="label">1440 x 900</p>
                </div>
                <div>
                  <div class="frame" data-w="390" data-h="844"><iframe src="${src}" title="${c.name} mobile" loading="lazy"></iframe></div>
                  <p class="label">390 x 844</p>
                </div>
              </div>
              <div class="notes">
                <div class="plus"><h3>For</h3><ul>${n.plus.map((x) => `<li>${x}</li>`).join("")}</ul></div>
                <div class="minus"><h3>Against</h3><ul>${n.minus.map((x) => `<li>${x}</li>`).join("")}</ul></div>
              </div>
            </article>`;
        }).join("");
        fit();
      }

      /* Render each preview at its real viewport size, then scale it down to the
         column, so media queries and svh behave as on a real screen. */
      function fit() {
        document.querySelectorAll(".frame").forEach((f) => {
          const w = +f.dataset.w;
          const h = +f.dataset.h;
          const s = f.clientWidth / w;
          f.style.height = `${h * s}px`;
          const ifr = f.querySelector("iframe");
          ifr.style.width = `${w}px`;
          ifr.style.height = `${h}px`;
          ifr.style.transform = `scale(${s})`;
        });
      }

      chips.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        current = b.dataset.slug;
        history.replaceState(null, "", `?p=${current}`);
        renderChips();
        renderCols();
      });

      addEventListener("resize", fit);
      renderChips();
      renderCols();
    </script>
  </body>
</html>
